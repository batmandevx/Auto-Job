<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Backend Engineer – Acme Corp</title>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"JobPosting","title":"Backend Engineer","hiringOrganization":{"@type":"Organization","name":"Acme Corp"},
   "description":"<p>We are hiring a Backend Engineer to build high-throughput APIs in Node.js and Go on AWS.</p><ul><li>3+ years building REST/GraphQL services</li><li>PostgreSQL, Redis, Kafka</li><li>Docker and Kubernetes</li><li>Experience with LLM integrations is a plus</li></ul>"}
  </script>
  <style>
    body { font: 14px system-ui; max-width: 640px; margin: 24px auto; padding: 0 16px; }
    .q { margin: 14px 0; } label { display: block; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=tel], input[type=url], textarea, select { width: 100%; padding: 6px; }
  </style>
</head>
<body>
  <h1>Backend Engineer</h1>
  <p>Acme Corp · Remote</p>
  <form id="app" onsubmit="event.preventDefault(); document.getElementById('done').textContent = 'SUBMITTED: ' + JSON.stringify(Object.fromEntries(new FormData(this)))">
    <div class="q"><label for="first_name">First Name *</label><input type="text" id="first_name" name="first_name" required /></div>
    <div class="q"><label for="last_name">Last Name *</label><input type="text" id="last_name" name="last_name" required /></div>
    <div class="q"><label for="email">Email *</label><input type="email" id="email" name="email" required /></div>
    <div class="q"><label for="phone">Phone</label><input type="tel" id="phone" name="phone" /></div>
    <div class="q"><label for="resume">Resume/CV *</label><input type="file" id="resume" name="resume" accept=".pdf" /></div>
    <div class="q"><label for="cover">Cover Letter</label><input type="file" id="cover" name="cover" /></div>
    <div class="q"><label for="li">LinkedIn Profile</label><input type="url" id="li" name="linkedin" /></div>
    <div class="q"><div>Years of professional backend experience</div><input type="text" name="years" /></div>
    <div class="q"><label for="auth">Are you legally authorized to work in the country of this role?</label>
      <select id="auth" name="auth"><option value="">Select...</option><option value="y">Yes</option><option value="n">No</option></select></div>
    <fieldset class="q"><legend>Will you now or in the future require visa sponsorship?</legend>
      <label><input type="radio" name="sponsor" value="yes" /> Yes</label>
      <label><input type="radio" name="sponsor" value="no" /> No</label>
    </fieldset>
    <div class="q"><label for="why">Why do you want to work at Acme? (max 1000 chars)</label><textarea id="why" name="why" maxlength="1000" rows="5"></textarea></div>
    <div class="q"><label><input type="checkbox" name="privacy" /> I agree to the privacy policy</label></div>
    <button type="submit">Submit Application</button>
  </form>
  <pre id="done"></pre>
</body>
</html>
