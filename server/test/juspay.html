<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Join us – phone code and captcha test</title>
  <style>
    body { font: 15px system-ui; max-width: 700px; margin: 24px auto; padding: 0 16px; }
    .row { display: flex; gap: 8px; } .code { padding: 10px 18px; border: 1px solid #ccc; } input { padding: 10px; flex: 1; }
    label { display: block; margin-top: 16px; }
  </style>
</head>
<body>
  <div><label for="ph">Contact Number *</label><div class="row"><div class="code">+91</div><input id="ph" type="text" inputmode="numeric" /></div></div>
  <div><label for="em">Email ID *</label><input id="em" type="text" /></div>
  <div class="captcha"><p>Please enter the text you see in the image:</p><img alt="captcha" width="120" height="40" /><br /><input id="cap" type="text" placeholder="Enter Captcha" /></div>
  <script>
    // The site keeps digits only, like the real form ("+91-9876543210" -> "919876543210").
    document.getElementById('ph').addEventListener('input', (e) => (e.target.value = e.target.value.replace(/\D/g, '')));
    window.report = () => ({ phone: document.getElementById('ph').value, captcha: document.getElementById('cap').value, focused: document.activeElement?.id });
  </script>
</body>
</html>
