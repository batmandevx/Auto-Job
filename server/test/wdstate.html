<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Experience – Workday state test</title>
  <style>body { font: 15px system-ui; max-width: 600px; margin: 24px auto; } label { display: block; margin-top: 14px; } input { padding: 8px; width: 100%; } .err { color: #c00; font-size: 13px; }</style>
</head>
<body>
  <h3>Work Experience 1</h3>
  <div data-automation-id="formField-jobTitle"><label for="t1">Job Title*</label><input id="t1" type="text" value="Applied Scientist Intern" aria-invalid="true" aria-describedby="t1-e" /><div class="err" id="t1-e">Error: The field Job Title is required and must have a value.</div></div>
  <div data-automation-id="formField-companyName"><label for="c1">Company*</label><textarea id="c1" aria-invalid="true" aria-describedby="c1-e">Microsoft, AI Platform</textarea><div class="err" id="c1-e">Error: The field Company is required and must have a value.</div></div>
  <script>
    // Like Workday: what you see in the box is not what it saves. It saves only when you type and leave
    // (input + focusout); the error clears when it has a value.
    const state = { t1: '', c1: '' };
    for (const id of ['t1', 'c1']) {
      const el = document.getElementById(id); let typed = false;
      el.addEventListener('input', (e) => { if (e.isTrusted) typed = true; }); // strict: script-made events don't count
      el.addEventListener('focusout', () => {
        if (typed) state[id] = el.value;
        const err = document.getElementById(id + '-e');
        err.textContent = state[id] ? '' : `Error: The field ${id === 't1' ? 'Job Title' : 'Company'} is required and must have a value.`;
        el.setAttribute('aria-invalid', state[id] ? 'false' : 'true');
      });
    }
    window.report = () => ({ caret: [...document.querySelectorAll('input,textarea')].map((e) => e.selectionStart === e.value.length), state: { ...state }, errors: [...document.querySelectorAll('.err')].map((e) => e.textContent).filter(Boolean).length });
  </script>
</body>
</html>
