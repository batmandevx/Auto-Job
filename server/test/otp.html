<!doctype html>
<html><head><meta charset="utf-8"><title>Verify – test</title>
<style>body{font:14px system-ui;max-width:520px;margin:30px auto}.boxes input{width:36px;height:40px;text-align:center;font-size:20px;margin:2px}</style></head>
<body>
<h2>Check your email</h2>
<p>We've sent a 6-digit verification code to ayush***@gmail.com.</p>
<div class="boxes"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div>
<p><label for="sec">Or paste the security code</label><input id="sec" type="text"></p>
<button id="verify" onclick="document.getElementById('out').textContent='CODE='+[...document.querySelectorAll('.boxes input')].map(i=>i.value).join('')">Verify</button>
<pre id="out"></pre>
<script>document.querySelectorAll('.boxes input').forEach((b,i,all)=>b.addEventListener('input',()=>{ if(b.value&&all[i+1]) all[i+1].focus(); }));</script>
</body></html>
