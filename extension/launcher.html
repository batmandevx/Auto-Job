<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { --bg: #ffffff; --fg: #12131a; --muted: #6b6f80; --line: #e6e8f0; --soft: #f1f2f8; --accent: #5b5bf6; --accent2: #9b5cf6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16181f; --fg: #eceef5; --muted: #9095a8; --line: #262935; --soft: #1e2029; --accent: #7c7cff; --accent2: #b07cff; } }
    * { box-sizing: border-box; }
    body { margin: 0; width: 300px; padding: 14px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .head img { width: 30px; height: 30px; border-radius: 9px; }
    .head b { font-size: 14px; } .head span { display: block; font-size: 11px; color: var(--muted); }
    button.opt { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; margin: 6px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); color: var(--fg); font: inherit; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
    button.opt:hover { transform: translateY(-1px); border-color: var(--accent); }
    button.opt.main { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }
    button.opt small { display: block; font-size: 11px; opacity: 0.75; }
    .ico { font-size: 18px; width: 22px; text-align: center; }
    label { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--muted); font-size: 12px; cursor: pointer; }
    #msg { font-size: 12px; color: #e0384a; margin-top: 8px; min-height: 0; }
  </style>
</head>
<body>
  <div class="head"><img src="logo.svg" alt="" /><div><b>Auto Job</b><span>How should it open?</span></div></div>
  <button class="opt main" data-mode="tab"><span class="ico">🗂</span><span>Open beside this page<small>New tab: in Arc, use Split View to see both</small></span></button>
  <button class="opt" data-mode="window"><span class="ico">🪟</span><span>Open in a window<small>A slim window next to your browser</small></span></button>
  <button class="opt" data-mode="sidepanel" id="sideBtn"><span class="ico">▤</span><span>Open side panel<small>Chrome, Edge, Brave</small></span></button>
  <label><input type="checkbox" id="remember" /> Always open this way</label>
  <div id="msg"></div>
  <script src="launcher.js"></script>
</body>
</html>
